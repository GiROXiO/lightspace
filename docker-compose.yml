name: lightspace

services:
  neo4j:
    image: neo4j:5.26-community
    container_name: lightspace-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc","apoc-extended"]'
      NEO4J_apoc_trigger_enabled: "true"
      NEO4J_apoc_trigger_refresh: "1000"
      NEO4J_apoc_custom_procedures_refresh: "1000"
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -u neo4j -p ${NEO4J_PASSWORD} 'RETURN 1' || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  usuarios:
    build: ./backend/usuarios
    container_name: lightspace-usuarios
    restart: unless-stopped
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SCHEMA_PATH: /database/schema.cypher
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "8001:8001"
    volumes:
      - ./backend/usuarios/app:/app/app
      - ./database:/database:ro

  cursos:
    build: ./backend/cursos
    container_name: lightspace-cursos
    restart: unless-stopped
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "8002:8002"
    volumes:
      - ./backend/cursos/app:/app/app

  recomendaciones:
    build: ./backend/recomendaciones
    container_name: lightspace-recomendaciones
    restart: unless-stopped
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "8003:8003"
    volumes:
      - ./backend/recomendaciones/app:/app/app

  gateway:
    build: ./backend/gateway
    container_name: lightspace-gateway
    restart: unless-stopped
    depends_on:
      - usuarios
      - cursos
      - recomendaciones
    environment:
      USUARIOS_URL: http://usuarios:8001
      CURSOS_URL: http://cursos:8002
      RECOMENDACIONES_URL: http://recomendaciones:8003
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./backend/gateway/app:/app/app

volumes:
  neo4j_data:
