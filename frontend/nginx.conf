server {
  listen 80;
  root /usr/share/nginx/html;

  # Las rutas las maneja React: /cursos o /perfil deben cargar la aplicación
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }

  # Los archivos compilados llevan un hash en el nombre
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}